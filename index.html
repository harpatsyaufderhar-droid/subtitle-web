<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>豆豆字幕提取器</title>
</head>

<body style="font-family:Arial;padding:40px;">

  <h1>豆豆字幕提取器</h1>

  <form
    action="/upload"
    method="post"
    enctype="multipart/form-data"
  >

    <input
      type="file"
      name="video"
      required
    >

    <br><br>

    <button type="submit">
      开始识别字幕
    </button>

  </form>

</body>
</html>
